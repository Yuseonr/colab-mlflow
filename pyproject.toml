[project]
name = "colab-mlflow"
version = "0.12.0"
description = "Reproducible Google Colab experiment tracking on Google Drive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=3.15,<4",
]

[project.scripts]
colab-mlflow = "colab_mlflow.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colab_mlflow"]
